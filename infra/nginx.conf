events { worker_connections 1024; }

http {
    upstream api_cluster {
        least_conn;
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }

    server {
        listen 80;
        location / {
            proxy_pass         http://api_cluster;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Host            $host;
            proxy_read_timeout 10s;
        }
    }
}
